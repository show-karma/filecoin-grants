# Builds the site on every PR and on main. It does NOT publish: Vercel serves
# www.filpgf.io through its own git integration, and did so while this workflow
# was also publishing the same build to GitHub Pages — a second copy that no
# DNS pointed at.
#
# The build still earns its place here: `pnpm build` runs `astro check` first,
# so a type error fails the PR instead of reaching Vercel.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs `astro check` first, so type errors fail the PR.
      - name: Build
        run: pnpm run build

      - name: Upload build for review
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14
