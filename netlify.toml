[build]
  publish = "dist"
  command = "pnpm run build"

[build.environment]
  NODE_VERSION = "22.17.0"

[dev]
  framework = "#custom"
  command = "pnpm run dev"
  targetPort = 4321
  port = 8888
  publish = "dist"
  autoLaunch = false

# Redirects — https://docs.netlify.com/routing/redirects/
# The Hugo site published /propgf and /batches/*. Those pages are folded into
# the objective-led IA, so keep the URLs alive rather than serving 404s.
[[redirects]]
  from = "/propgf/*"
  to = "/#objectives"
  status = 301
  force = true

[[redirects]]
  from = "/batches/*"
  to = "/#objectives"
  status = 301
  force = true

# Custom headers — https://docs.netlify.com/routing/headers/
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # The site ships no client-side JavaScript and self-hosts its fonts.
    # 'unsafe-inline' on style-src covers the inline style attributes used for
    # per-tier and per-program accent colours.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"

# HTML must revalidate so content changes go live on deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Astro emits content-hashed asset filenames, so these are safe to pin.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
